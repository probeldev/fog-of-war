<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Content-Security-Policy" content="default-src *; style-src * 'unsafe-inline'; script-src * 'unsafe-inline' 'unsafe-eval'; img-src * data: blob:; connect-src *;">
    <title>Туман Войны</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- App CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Main Map Screen -->
    <div id="app">
        <div id="map"></div>

        <!-- Top Stats Bar -->
        <div id="stats-bar">
            <div class="stat-item">
                <span class="stat-icon">🗺️</span>
                <span id="explored-percent">0%</span>
            </div>
            <div class="stat-item">
                <span class="stat-icon">📍</span>
                <span id="distance">0 м</span>
            </div>
            <div class="stat-item">
                <span class="stat-icon">⏱️</span>
                <span id="time">00:00</span>
            </div>
            <div class="stat-item" id="mode-indicator" title="Режим: пешком">
                <span class="stat-icon">🚶</span>
            </div>
        </div>
        
        <!-- Bottom Controls -->
        <div id="controls">
            <button id="btn-center" class="control-btn" title="Моё местоположение">
                <svg viewBox="0 0 24 24" width="24" height="24">
                    <circle cx="12" cy="12" r="3" fill="currentColor"/>
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8z" fill="currentColor"/>
                </svg>
            </button>
            <button id="btn-reset" class="control-btn" title="Сбросить прогресс">
                <svg viewBox="0 0 24 24" width="24" height="24">
                    <path d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z" fill="currentColor"/>
                </svg>
            </button>
            <button id="btn-settings" class="control-btn" title="Настройки">
                <svg viewBox="0 0 24 24" width="24" height="24">
                    <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.488.488 0 00-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 00-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58a.49.49 0 00-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1115.6 12 3.611 3.611 0 0112 15.6z" fill="currentColor"/>
                </svg>
            </button>
        </div>
        
        <!-- Start Screen Overlay -->
        <div id="start-screen">
            <div class="start-content">
                <h1>🌫️ Туман Войны</h1>
                <p class="subtitle">Исследуй свой город</p>
                <div class="description">
                    <p>Вся карта скрыта туманом. Ходи по городу и открывай новые территории!</p>
                </div>
                <button id="btn-start" class="primary-btn">
                    Начать исследование
                </button>
                <p class="hint">* Приложение использует GPS для отслеживания</p>
            </div>
        </div>
        
        <!-- Settings Modal -->
        <div id="settings-modal" class="modal hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Настройки</h2>
                    <button id="btn-close-settings" class="close-btn">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="setting-group">
                        <label for="radius-slider">Радиус открытия:</label>
                        <div class="slider-container">
                            <input type="range" id="radius-slider" min="10" max="200" value="50" step="5">
                            <span id="radius-value">50 м</span>
                        </div>
                    </div>
                    <div class="setting-group">
                        <label for="opacity-slider">Прозрачность тумана:</label>
                        <div class="slider-container">
                            <input type="range" id="opacity-slider" min="50" max="100" value="95" step="5">
                            <span id="opacity-value">95%</span>
                        </div>
                    </div>
                    <div class="setting-group">
                        <button id="btn-export" class="secondary-btn">Экспорт прогресса</button>
                        <button id="btn-import" class="secondary-btn">Импорт прогресса</button>
                    </div>
                    <input type="file" id="import-file" accept=".json" style="display:none">
                </div>
            </div>
        </div>
        
        <!-- Reset Confirmation Modal -->
        <div id="reset-modal" class="modal hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Сбросить прогресс?</h2>
                    <button id="btn-close-reset" class="close-btn">&times;</button>
                </div>
                <div class="modal-body">
                    <p>Весь прогресс будет потерян. Это действие нельзя отменить.</p>
                    <div class="modal-actions">
                        <button id="btn-cancel-reset" class="secondary-btn">Отмена</button>
                        <button id="btn-confirm-reset" class="danger-btn">Сбросить</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- App Scripts -->
    <script src="js/nativeLocation.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
